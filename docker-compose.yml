name: grid-repair

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-backend
    environment:
      PORT: 3000
      # 容器内 SQLite 文件路径（挂载卷持久化）
      GRID_REPAIR_DB_FILE: /app/data/grid-repair.sqlite
    volumes:
      - backend_data:/app/data
    ports:
      - "${BACKEND_PORT:-21104}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-grid-repair}-frontend
    ports:
      - "${FRONTEND_PORT:-20104}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
